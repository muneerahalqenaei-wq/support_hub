<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Service Ticketing Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-teal: #268F85;
      --brand-olive: #769555;
      --brand-gold: #F19A1A;
      --ink: #000000;
      --paper: #FFFFFF;
      --mist: #f4f8f5;
      --line: #d9e5dd;
      --muted: #637067;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font-family: Tahoma, sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #F19A1A;
      outline-offset: 2px;
    }

    .app-shell { width: 100%; min-height: calc(100 * min(var(--vh, 1vh), 1vh)); display: flex; }
    .side-nav {
      width: 270px; position: fixed; right: 0; top: 0; bottom: 0; z-index: 40;
      background: var(--brand-teal); color: white; padding: 26px 16px;
      box-shadow: -8px 0 26px #0000001a;
    }
    .main-area { width: calc(100% - 270px); margin-right: 270px; min-height: calc(100 * min(var(--vh, 1vh), 1vh)); }
    .brand { display: flex; gap: 12px; align-items: center; padding: 0 10px 28px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
      background: var(--brand-gold); color: #000000;
    }
    .brand-subtitle { margin: 3px 0 0; font-size: 10px; color: #e3f3ee; letter-spacing: .08em; }
    .nav-link {
      width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: transparent;
      color: #e5f4f0; border-radius: 10px; padding: 12px 13px; margin: 4px 0; text-align: right;
      font-size: 14px; transition: .18s ease;
    }
    .nav-link:hover, .nav-link.active { background: #ffffff22; color: #FFFFFF; }
    .nav-link.active { box-shadow: inset -3px 0 var(--brand-gold); }
    .topbar {
      width: 100%; min-height: 76px; background: #FFFFFF; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 30px; position: sticky; top: 0; z-index: 20;
    }
    .page-body { width: 100%; padding: 28px 30px 50px; }
    .view-title { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.5px; }
    .subtle { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    .primary-btn, .soft-btn {
      border: 0; border-radius: 10px; padding: 10px 15px; display: inline-flex; gap: 8px;
      align-items: center; justify-content: center; font-weight: 700; font-size: 13px; transition: .18s ease;
    }
    .primary-btn { background: var(--brand-teal); color: #FFFFFF; }
    .primary-btn:hover { background: #1c7068; }
    .soft-btn { background: #e8f2ed; color: #216f67; }
    .soft-btn:hover { background: #d6e8dd; }
    .card { background: #FFFFFF; border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 5px 18px #133a240a; }
    .summary-grid { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: 14px; margin-top: 24px; }
    .metric { padding: 17px; min-height: 112px; border-top: 4px solid #c9ddd2; }
    .metric.urgent { border-top-color: #e55454; }
    .metric.green { border-top-color: #28a77a; }
    .metric.gold { border-top-color: var(--brand-gold); }
    .metric .label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .metric .number { margin-top: 9px; font-size: 26px; font-weight: 800; }
    .dashboard-grid { display: grid; grid-template-columns: 1.35fr .9fr; gap: 18px; margin-top: 18px; }
    .section-card { padding: 20px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .section-head h2 { margin: 0; font-size: 16px; font-weight: 800; }
    .chart-row { display: grid; grid-template-columns: 125px 1fr 38px; gap: 10px; align-items: center; margin: 13px 0; font-size: 12px; }
    .track { height: 9px; border-radius: 10px; overflow: hidden; background: #edf3ef; }
    .bar { height: 100%; border-radius: 10px; background: var(--brand-olive); }
    .field, .select-field {
      width: 100%; border: 1px solid #cfddd4; background: #FFFFFF; color: #17281e;
      border-radius: 9px; padding: 10px 11px; font-size: 13px;
    }
    .field:focus, .select-field:focus { border-color: var(--brand-teal); box-shadow: 0 0 0 3px #268F8520; outline: none; }
    .filter-grid { display: grid; grid-template-columns: 2fr repeat(2, 1fr); gap: 10px; }
    .table-wrap { overflow: auto; }
    .data-table { width: 100%; min-width: 850px; border-collapse: collapse; }
    .data-table th { background: #f7faf8; border-bottom: 1px solid var(--line); color: #607067; font-size: 11px; padding: 13px 12px; text-align: right; white-space: nowrap; }
    .data-table td { border-bottom: 1px solid #edf3ef; font-size: 12px; padding: 14px 12px; vertical-align: middle; }
    .data-table tr:hover td { background: #fbfdfb; }
    .ticket-link { border: 0; background: transparent; padding: 0; color: var(--brand-teal); font-weight: 800; text-decoration: none; }
    .mono { font-family: Tahoma, sans-serif; direction: ltr; display: inline-block; }
    .badge { display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }

    .status-new { background: #e5efff; color: #195bad; }
    .status-open { background: #ecf2f8; color: #42617d; }
    .status-progress { background: #fff5d9; color: #966600; }
    .status-pending { background: #f4edff; color: #7651a9; }
    .status-resolved { background: #dcf8ed; color: #16845e; }
    .status-closed { background: #e9edf1; color: #596779; }
    .priority-urgent { background: #ffebeb; color: #c73636; }
    .priority-high { background: #fff1dd; color: #b16700; }
    .priority-medium { background: #eaf2ff; color: #326bc0; }
    .priority-low { background: #e7f7ee; color: #247e55; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 18px; background: #0a2824a3; }
    .modal {
      width: min(650px, 100%);
      max-height: calc(100dvh - 36px);
      background: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0004;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-head, .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      flex-shrink: 0;
    }
    .modal-head { border-bottom: 1px solid var(--line); }
    .modal-foot {
      border-top: 1px solid var(--line);
      justify-content: flex-start;
      background: #FFFFFF;
      position: sticky;
      bottom: 0;
      z-index: 2;
    }
    .modal-body {
      padding: 22px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-full { grid-column: 1 / -1; }
    .panel-label { display: block; margin-bottom: 7px; color: #53655a; font-size: 11px; font-weight: 800; }
    .toast {
      position: fixed; left: 25px; bottom: 25px; z-index: 100; max-width: min(360px, calc(100% - 50px));
      background: #268F85; color: #FFFFFF; border-right: 4px solid #F19A1A; border-radius: 10px;
      padding: 13px 17px; box-shadow: 0 10px 28px #00000033; font-size: 13px;
      transform: translateY(110px); opacity: 0; transition: .25s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .hidden { display: none !important; }
    .mobile-menu { display: none; }

    body[dir="ltr"] .side-nav { right: auto; left: 0; box-shadow: 8px 0 26px #0000001a; }
    body[dir="ltr"] .main-area { margin-right: 0; margin-left: 270px; }
    body[dir="ltr"] .nav-link { text-align: left; }
    body[dir="ltr"] .nav-link.active { box-shadow: inset 3px 0 var(--brand-gold); }
    body[dir="ltr"] .data-table th { text-align: left; }

    @media (max-width: 1100px) {
      .summary-grid { grid-template-columns: repeat(3, 1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    body.create-ticket-mode, body.edit-ticket-mode { overflow: hidden !important; }
    body.create-ticket-mode .side-nav,
    body.create-ticket-mode .topbar,
    body.edit-ticket-mode .side-nav,
    body.edit-ticket-mode .topbar { display: none !important; }
    body.create-ticket-mode .main-area, body.edit-ticket-mode .main-area { width: 100% !important; margin: 0 !important; min-height: 100dvh !important; }
    body.create-ticket-mode .page-body, body.edit-ticket-mode .page-body { padding: 0 !important; width: 100% !important; min-height: 100dvh !important; }
    body.create-ticket-mode #appMain, body.edit-ticket-mode #appMain { width: 100%; min-height: 100dvh; }
    .create-ticket-screen {
      width: 100%; min-height: 100dvh; background: #f4f8f5;
      overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      padding: 24px 30px 60px;
    }
    .create-ticket-inner { width: 100%; max-width: 900px; margin: 0 auto; }
    .create-ticket-card { background:#fff; border:1px solid var(--line); border-radius:15px; padding:22px; margin-top:18px; }
    @media (max-width:760px) {
      .create-ticket-screen { min-height:100dvh; padding:16px 12px 50px; }
      .create-ticket-card { border-radius:12px; padding:16px; margin-top:14px; }
      .create-ticket-screen .form-grid { grid-template-columns:1fr; }
    }

    @media (max-width: 760px) {
      html, body {
        min-height: 100%;
        height: auto;
        overflow-y: auto !important;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      #modalRoot { position: relative; }
      .side-nav { transform: translateX(100%); transition: .2s ease; }
      body[dir="ltr"] .side-nav { transform: translateX(-100%); }
      .side-nav.open { transform: translateX(0); }
      .main-area, body[dir="ltr"] .main-area { width: 100%; margin-right: 0; margin-left: 0; }
      .topbar { padding: 13px 16px; }
      .page-body { padding: 20px 15px 40px; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-grid, .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: auto; }
      .mobile-menu { display: inline-flex; }
      .view-title { font-size: 20px; }
      .modal-backdrop {
        position: absolute; inset: 0 auto auto 0; width: 100%;
        min-height: 100vh; min-height: 100dvh; height: auto;
        align-items: flex-start; padding: 12px; overflow: visible;
      }
      .modal { width: 100%; max-height: none; height: auto; margin: 0 auto; border-radius: 14px; overflow: visible; }
      .modal-head, .modal-foot { padding: 14px 16px; }
      .modal-foot { position: static; flex-wrap: wrap; background: #FFFFFF; }
      .modal-foot .primary-btn, .modal-foot .soft-btn { min-height: 44px; flex: 1 1 140px; }
      .modal-body { padding: 16px; overflow: visible; }
    }
  
    @media (max-width: 760px) {
      .page-body { overflow: visible !important; height: auto !important; min-height: calc(100dvh - 70px); padding-bottom: 32px; }
      #appMain { overflow: visible !important; height: auto !important; }
      #ticketForm { width: 100%; }
    }
</style>
 </head>
 <body data-template-id="__page-root" style="background: rgb(244, 248, 245);">
  <div class="app-shell">
   <aside class="side-nav" id="sidebar">
    <header class="brand">
     <div class="brand-mark" aria-hidden="true"><i data-lucide="headphones"></i>
     </div>
     <div>
      <strong data-template-id="brand-name" class="canva-text" style="color: rgb(255, 255, 255); font-weight: 800; font-style: normal; font-size: 15px;">Customer Service</strong>
      <p data-template-id="brand-subtitle" class="canva-text brand-subtitle" style="color: rgb(227, 243, 238); font-weight: 700; font-style: normal; font-size: 10px; letter-spacing: 0.08rem;">TICKETING DASHBOARD</p>
     </div>
    </header>
    <nav aria-label="التنقل الرئيسي">
     <button class="nav-link active" type="button" data-view="dashboard"> <i data-lucide="layout-dashboard"></i> <span class="canva-text" data-template-id="nav-dashboard" style="color: rgb(229, 244, 240); font-weight: 600; font-style: normal; font-size: 16px;">لوحة التحكم</span> </button> <button class="nav-link" type="button" data-view="tickets"> <i data-lucide="ticket"></i> <span class="canva-text" data-template-id="nav-tickets" style="color: rgb(229, 244, 240); font-weight: 600; font-style: normal; font-size: 16px;">التذاكر</span> </button> 
     <!-- زر الأرشيف المضاف حديثاً -->
     <button class="nav-link" type="button" data-view="archive"> <i data-lucide="archive"></i> <span class="canva-text" data-template-id="nav-archive" style="color: rgb(229, 244, 240); font-weight: 600; font-style: normal; font-size: 16px;">الأرشيف</span> </button>
     <button class="nav-link" type="button" data-view="employees"> <i data-lucide="users"></i> <span class="canva-text" data-template-id="nav-employees" style="color: rgb(229, 244, 240); font-weight: 600; font-style: normal; font-size: 16px;">الموظفون</span> </button> <button class="nav-link" type="button" data-view="reports"> <i data-lucide="chart-no-axes-combined"></i> <span class="canva-text" data-template-id="nav-reports" style="color: rgb(229, 244, 240); font-weight: 600; font-style: normal; font-size: 16px;">التقارير</span> </button> <button class="nav-link" type="button" data-view="settings"> <i data-lucide="settings"></i> <span class="canva-text" data-template-id="nav-settings" style="color: rgb(229, 244, 240); font-weight: 600; font-style: normal; font-size: 16px;">الإعدادات</span> </button> <button class="nav-link" type="button" data-view="guide"> <i data-lucide="book-open"></i> <span class="canva-text" data-template-id="nav-guide" style="color: rgb(229, 244, 240); font-weight: 600; font-style: normal; font-size: 16px;">دليل الاستخدام</span> </button>
    </nav>
   </aside>
   <div class="main-area">
    <header data-template-id="topbar-section" class="canva-header topbar" style="background: rgb(255, 255, 255);">
     <button class="soft-btn mobile-menu" id="menuBtn" type="button" aria-label="فتح القائمة"> <i data-lucide="menu"></i> </button>
     <div class="flex items-center gap-3">
      <button data-template-id="language-toggle" class="canva-button soft-btn" id="languageToggle" type="button" aria-label="تبديل اللغة" style="background: rgb(232, 242, 237); color: rgb(33, 111, 103); font-weight: 700; font-style: normal; font-size: 16px;">English</button> <span class="badge status-open">Admin</span>
     </div><button data-template-id="create-ticket-button" class="canva-button primary-btn" id="createTicketBtn" type="button" style="background: rgb(38, 143, 133); color: rgb(255, 255, 255); font-weight: 700;"> <i data-lucide="plus"></i> <span data-template-id="create-ticket-label" class="canva-text" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">إنشاء تذكرة</span> </button>
    </header>
    <main class="page-body" id="appMain" aria-live="polite"></main>
   </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <script>
    (() => {
      let tickets = [];
      let employees = [];
      let issueShortcuts = [];
      let ticketSources = [];
      let slaSettings = { Urgent: 1, High: 4, Medium: 12, Low: 24 };

      let currentView = "dashboard";
      let selectedTicketId = "";
      let currentActor = "Admin";
      let language = "ar";
      let toastTimer;

      // Supabase configuration
      const SUPABASE_URL = "https://eojlplddbjodknseubva.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_No1R26-FkTL-YAuAykugtA_k0BxK39f";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      window.supabaseClient = supabaseClient;

      let currentUser = null;

      async function getSession() {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        currentUser = data.session?.user || null;
        return currentUser;
      }

      async function requireLogin() {
        const user = await getSession();
        if (!user) {
          const email = window.prompt(language === "ar" ? "أدخل البريد الإلكتروني" : "Enter email");
          const password = window.prompt(language === "ar" ? "أدخل كلمة المرور" : "Enter password");
          if (!email || !password) throw new Error(language === "ar" ? "تم إلغاء تسجيل الدخول." : "Login cancelled.");
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentUser = data.user;
        }
        return currentUser;
      }

      async function dbError(error) {
        console.error(error);
        showToast((language === "ar" ? "حدث خطأ: " : "Error: ") + (error?.message || "Unknown error"));
      }

      async function loadData() {
        await requireLogin();

        const [
          ticketsRes,
          employeesRes,
          sourcesRes,
          shortcutsRes,
          slaRes
        ] = await Promise.all([
          supabaseClient.from("tickets").select("*").order("created_at", { ascending: false }),
          supabaseClient.from("employees").select("*").order("name"),
          supabaseClient.from("ticket_sources").select("*").eq("is_active", true).order("name"),
          supabaseClient.from("issue_shortcuts").select("*").eq("is_active", true).order("label"),
          supabaseClient.from("sla_settings").select("priority,hours")
        ]);

        for (const result of [ticketsRes, employeesRes, sourcesRes, shortcutsRes, slaRes]) {
          if (result.error) throw result.error;
        }

        employees = employeesRes.data || [];
        ticketSources = (sourcesRes.data || []).map(x => x.name);
        issueShortcuts = (shortcutsRes.data || []).map(x => x.label);
        for (const row of (slaRes.data || [])) {
          if (row.priority && Number.isFinite(Number(row.hours))) slaSettings[row.priority] = Number(row.hours);
        }

        const rawTickets = ticketsRes.data || [];
        tickets = rawTickets.map(t => ({
          id: t.ticket_number,
          dbId: t.id,
          customer: t.customer_name,
          phone: t.customer_phone || t.phone || "-",
          issue: t.issue_summary,
          description: t.issue_description || "",
          category: t.category,
          source: t.source || "",
          priority: t.priority,
          assignee: employees.find(e => e.id === t.assignee_id)?.name || "",
          assigneeId: t.assignee_id,
          status: t.status,
          finalResolution: t.final_resolution || "",
          createdAt: t.created_at?.slice(0, 10) || "",
          closedAt: t.closed_at?.slice(0, 10) || "",
          updated: t.updated_at || "",
          messages: [],
          attachments: []
        }));

        await Promise.all(tickets.map(async ticket => {
          const [messagesRes, attachmentsRes] = await Promise.all([
            supabaseClient.from("ticket_messages").select("*").eq("ticket_id", ticket.dbId).order("created_at", { ascending: true }),
            supabaseClient.from("ticket_attachments").select("*").eq("ticket_id", ticket.dbId).order("created_at", { ascending: true })
          ]);
          if (messagesRes.error) throw messagesRes.error;
          if (attachmentsRes.error) throw attachmentsRes.error;

          ticket.messages = (messagesRes.data || []).map(m => ({
            id: m.id,
            author: m.author_name || "Support",
            role: m.role || "support",
            text: m.message || "",
            at: m.created_at,
            attachment: null
          }));

          ticket.attachments = [];
          for (const file of (attachmentsRes.data || [])) {
            const signed = await supabaseClient.storage
              .from("ticket-attachments")
              .createSignedUrl(file.storage_path, 3600);
            ticket.attachments.push({
              id: file.id,
              name: file.file_name,
              type: file.mime_type,
              size: file.file_size,
              path: file.storage_path,
              url: signed.data?.signedUrl || "#"
            });
          }
        }));
      }

      async function refreshAndRender(view = currentView) {
        try {
          await loadData();
          currentView = view;
          render();
        } catch (error) {
          await dbError(error);
        }
      }

      async function uploadTicketFiles(ticketDbId, files) {
        const selectedFiles = Array.from(files || []);
        for (const file of selectedFiles) {
          const safeName = file.name.replace(/[^\w.\-() ]/g, "_");
          const path = `${ticketDbId}/${crypto.randomUUID()}-${safeName}`;
          const upload = await supabaseClient.storage.from("ticket-attachments").upload(path, file, {
            cacheControl: "3600",
            upsert: false
          });
          if (upload.error) throw upload.error;

          const insert = await supabaseClient.from("ticket_attachments").insert({
            ticket_id: ticketDbId,
            file_name: file.name,
            storage_path: path,
            mime_type: file.type || "application/octet-stream",
            file_size: file.size,
            uploaded_by: currentUser?.id || null
          });
          if (insert.error) throw insert.error;
        }
      }

      async function addMessage(ticketDbId, text, actor, attachmentFile = null) {
        if (!text && !attachmentFile) return;
        let attachmentId = null;
        if (attachmentFile) {
          const safeName = attachmentFile.name.replace(/[^\w.\-() ]/g, "_");
          const path = `${ticketDbId}/messages/${crypto.randomUUID()}-${safeName}`;
          const upload = await supabaseClient.storage.from("ticket-attachments").upload(path, attachmentFile, {
            cacheControl: "3600",
            upsert: false
          });
          if (upload.error) throw upload.error;

          const attachmentInsert = await supabaseClient.from("ticket_attachments").insert({
            ticket_id: ticketDbId,
            file_name: attachmentFile.name,
            storage_path: path,
            mime_type: attachmentFile.type || "image/*",
            file_size: attachmentFile.size,
            uploaded_by: currentUser?.id || null
          }).select("id").single();
          if (attachmentInsert.error) throw attachmentInsert.error;
          attachmentId = attachmentInsert.data.id;
        }

        const result = await supabaseClient.from("ticket_messages").insert({
          ticket_id: ticketDbId,
          author_user_id: currentUser?.id || null,
          author_name: actor,
          role: actor === "Admin" ? "admin" : "support",
          message: text,
          attachment_id: attachmentId
        });
        if (result.error) throw result.error;
      }

      const translations = {
        dashboard: ["لوحة التحكم", "Dashboard"], tickets: ["التذاكر", "Tickets"], archive: ["الأرشيف", "Archive"], employees: ["الموظفون", "Employees"], reports: ["التقارير", "Reports"], settings: ["الإعدادات", "Settings"], guide: ["دليل الاستخدام", "User Guide"], create: ["إنشاء تذكرة", "Create Ticket"],
        new: ["جديدة", "New"], open: ["مفتوحة", "Open"], inProgress: ["قيد المعالجة", "In Progress"], pendingCustomer: ["بانتظار العميل", "Pending Customer"], resolved: ["محلولة", "Resolved"], closed: ["مغلقة", "Closed"],
        urgent: ["عاجلة", "Urgent"], high: ["عالية", "High"], medium: ["متوسطة", "Medium"], low: ["منخفضة", "Low"],
        payment: ["الدفع", "Payment"], coupon: ["القسائم", "Coupon"], refund: ["الاسترداد", "Refund"], wallet: ["المحفظة", "Wallet"], other: ["أخرى", "Other"],
        ticket: ["تذكرة", "Ticket"], customer: ["اسم العميل", "Customer Name"], phone: ["رقم الجوال", "Phone Number"], issue: ["المشكلة", "Issue"], assignedTo: ["الموظف المسؤول", "Assigned To"], status: ["الحالة", "Status"], priority: ["الأولوية", "Priority"], createdAt: ["تاريخ الإنشاء", "Created At"], actions: ["الإجراءات", "Actions"]
      };

      function text(key) { return translations[key] ? translations[key][language === "ar" ? 0 : 1] : key; }
      function displayStatus(value) { const key = {"New":"new","Open":"open","In Progress":"inProgress","Pending Customer":"pendingCustomer","Resolved":"resolved","Closed":"closed"}[value]; return key ? text(key) : value; }
      function displayPriority(value) { return text(value.toLowerCase()); }
      function displayCategory(value) { const key = value.toLowerCase(); return translations[key] ? text(key) : value; }
      function statusOption(value) { return `<option value="${value}">${displayStatus(value)}</option>`; }
      function priorityOption(value) { return `<option value="${value}">${displayPriority(value)}</option>`; }

      function applyLanguageChrome() {
        document.documentElement.lang = language === "ar" ? "ar" : "en";
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        document.body.dir = document.documentElement.dir;
        document.querySelector('[data-template-id="language-toggle"]').textContent = language === "ar" ? "English" : "العربية";
        document.querySelector('[data-template-id="nav-dashboard"]').textContent = text("dashboard");
        document.querySelector('[data-template-id="nav-tickets"]').textContent = text("tickets");
        document.querySelector('[data-template-id="nav-archive"]').textContent = text("archive");
        document.querySelector('[data-template-id="nav-employees"]').textContent = text("employees");
        document.querySelector('[data-template-id="nav-reports"]').textContent = text("reports");
        document.querySelector('[data-template-id="nav-settings"]').textContent = text("settings");
        document.querySelector('[data-template-id="nav-guide"]').textContent = text("guide");
        document.querySelector('[data-template-id="create-ticket-label"]').textContent = text("create");
      }

      function esc(value) {
        return String(value || "").replace(/[&<>"']/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[char]));
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
      }

      function statusClass(status) {
        if (status === "New") return "status-new";
        if (status === "Open") return "status-open";
        if (status === "In Progress") return "status-progress";
        if (status.startsWith("Pending")) return "status-pending";
        if (status === "Resolved") return "status-resolved";
        return "status-closed";
      }

      function priorityClass(priority) {
        return "priority-" + priority.toLowerCase();
      }

      function pageHeader(title, subtitle) {
        return `<section><h1 class="view-title">${title}</h1><p class="subtle">${subtitle}</p></section>`;
      }

      function metric(label, number, accent = "") {
        return `<article class="card metric ${accent}"><div class="label">${label}</div><div class="number">${number}</div></article>`;
      }

      function chart(label, amount, total) {
        const width = Math.max(7, Math.round((amount / Math.max(total, 1)) * 100));
        return `<div class="chart-row"><span>${label}</span><div class="track"><div class="bar" style="width:${width}%"></div></div><b>${amount}</b></div>`;
      }

      function renderDashboard(main) {
        const count = status => tickets.filter(ticket => ticket.status === status).length;
        const pending = tickets.filter(ticket => ticket.status.startsWith("Pending")).length;
        const urgent = tickets.filter(ticket => ticket.priority === "Urgent").length;

        main.innerHTML = `
          ${pageHeader(language === "ar" ? "لوحة التحكم" : "Dashboard", language === "ar" ? "متابعة فورية لتذاكر خدمة العملاء" : "Real-time customer service ticket tracking")}
          <section class="summary-grid">
            ${metric(language === "ar" ? "إجمالي التذاكر" : "Total Tickets", tickets.length)}
            ${metric(language === "ar" ? "مفتوحة" : "Open", count("Open"))}
            ${metric(language === "ar" ? "قيد المعالجة" : "In Progress", count("In Progress"), "gold")}
            ${metric(language === "ar" ? "معلقة" : "Pending", pending)}
            ${metric(language === "ar" ? "عاجلة" : "Urgent", urgent, "urgent")}
            ${metric(language === "ar" ? "محلولة" : "Resolved", count("Resolved"), "green")}
          </section>
          <section class="dashboard-grid">
            <article class="card section-card">
              <div class="section-head"><h2>${language === "ar" ? "التذاكر حسب الحالة" : "Tickets by Status"}</h2><span class="subtle">${language === "ar" ? "تحديث مباشر" : "Live update"}</span></div>
              ${chart(displayStatus("New"), count("New"), tickets.length)}
              ${chart(displayStatus("Open"), count("Open"), tickets.length)}
              ${chart(displayStatus("In Progress"), count("In Progress"), tickets.length)}
              ${chart(displayStatus("Pending Customer"), pending, tickets.length)}
              ${chart(displayStatus("Resolved"), count("Resolved"), tickets.length)}
            </article>
            <article class="card section-card">
              <div class="section-head"><h2>${language === "ar" ? "تنبيهات SLA" : "SLA Alerts"}</h2><span class="badge priority-urgent">${urgent} ${language === "ar" ? "عاجلة" : "Urgent"}</span></div>
              ${tickets.slice(0, 4).map(ticket => `<button class="ticket-link w-full text-right border-b border-slate-100 py-3 open-tickets" type="button"><span class="mono">${ticket.id}</span><br><span class="font-normal text-slate-500">${esc(ticket.issue)}</span></button>`).join("")}
            </article>
            <article class="card section-card">
              <div class="section-head"><h2>${language === "ar" ? "التصنيف والقناة" : "Category & Channel"}</h2></div>
              ${chart(displayCategory("Payment"), tickets.filter(ticket => ticket.category === "Payment").length, tickets.length)}
              ${chart(displayCategory("Coupon"), tickets.filter(ticket => ticket.category === "Coupon").length, tickets.length)}
              ${chart(displayCategory("Wallet"), tickets.filter(ticket => ticket.category === "Wallet").length, tickets.length)}
              ${chart(displayCategory("Refund"), tickets.filter(ticket => ticket.category === "Refund").length, tickets.length)}
            </article>
            <article class="card section-card">
              <div class="section-head"><h2>${language === "ar" ? "عبء العمل حسب الموظف" : "Workload by Employee"}</h2></div>
              ${employees.map(employee => chart(employee.name.split(" ")[0], tickets.filter(ticket => ticket.assignee === employee.name).length, tickets.length)).join("")}
            </article>
          </section>`;

        main.querySelectorAll(".open-tickets").forEach(button => button.addEventListener("click", () => {
          currentView = "tickets";
          render();
        }));
      }

      function renderTickets(main) {
        main.innerHTML = `
          ${pageHeader(language === "ar" ? "كل التذاكر" : "All Tickets", language === "ar" ? "بحث وفرز وتصفية تذاكر فريق خدمة العملاء" : "Search, sort, and filter customer service tickets")}
          <section class="card section-card mt-5">
            <div class="filter-grid">
              <div><label class="sr-only" for="ticketSearch">بحث</label><input id="ticketSearch" class="field" placeholder="${language === "ar" ? "بحث: التذكرة / العميل / الجوال / المشكلة" : "Search: Ticket / Customer / Phone / Issue"}"></div>
              <div><label class="sr-only" for="statusFilter">الحالة</label><select id="statusFilter" class="select-field"><option value="">${language === "ar" ? "كل الحالات" : "All statuses"}</option>${statusOption("Open")}${statusOption("In Progress")}${statusOption("Pending Customer")}${statusOption("Resolved")}${statusOption("Closed")}</select></div>
              <div><label class="sr-only" for="priorityFilter">الأولوية</label><select id="priorityFilter" class="select-field"><option value="">${language === "ar" ? "كل الأولويات" : "All priorities"}</option>${priorityOption("Urgent")}${priorityOption("High")}${priorityOption("Medium")}${priorityOption("Low")}</select></div>
              <div><label class="sr-only" for="dateFromFilter">من تاريخ</label><input id="dateFromFilter" class="field" type="date"></div>
              <div><label class="sr-only" for="dateToFilter">إلى تاريخ</label><input id="dateToFilter" class="field" type="date"></div>
              <button class="primary-btn" id="exportFilteredTicketsBtn" type="button"><i data-lucide="download"></i> ${language === "ar" ? "تصدير النتائج" : "Export Results"}</button>
            </div>
          </section>
          <section class="card mt-4 table-wrap">
            <table class="data-table">
              <thead><tr><th>${text("ticket")}</th><th>${text("customer")}</th><th>${text("phone")}</th><th>${text("issue")}</th><th>${language === "ar" ? "التصنيف" : "Category"}</th><th>${text("priority")}</th><th>${text("assignedTo")}</th><th>${text("status")}</th><th>${text("createdAt")}</th><th>${text("actions")}</th></tr></thead>
              <tbody id="ticketTableBody"></tbody>
            </table>
          </section>
          <div id="paginationContainer" class="flex items-center justify-between mt-4 px-2"></div>`;

        const search = document.getElementById("ticketSearch");
        const status = document.getElementById("statusFilter");
        const priority = document.getElementById("priorityFilter");
        const dateFrom = document.getElementById("dateFromFilter");
        const dateTo = document.getElementById("dateToFilter");
        const body = document.getElementById("ticketTableBody");
        const paginationContainer = document.getElementById("paginationContainer");

        let currentPage = 1;
        const pageSize = 10;

        function filteredTickets() {
          const query = search.value.trim().toLowerCase();
          return tickets.filter(ticket => {
            const searchable = [ticket.id, ticket.customer, ticket.phone, ticket.issue, ticket.assignee].join(" ").toLowerCase();
            return (!query || searchable.includes(query)) &&
              (!status.value || ticket.status === status.value) &&
              (!priority.value || ticket.priority === priority.value) &&
              (!dateFrom.value || ticket.createdAt >= dateFrom.value) &&
              (!dateTo.value || ticket.createdAt <= dateTo.value);
          });
        }

        function drawTickets() {
          const displayed = filteredTickets();
          const totalPages = Math.ceil(displayed.length / pageSize) || 1;
          if (currentPage > totalPages) currentPage = totalPages;

          const start = (currentPage - 1) * pageSize;
          const pageItems = displayed.slice(start, start + pageSize);

          body.innerHTML = pageItems.length ? pageItems.map(ticket => `
            <tr>
              <td>
                <div class="flex items-center gap-1.5">
                  <span class="ticket-link mono">${ticket.id}</span>
                  <button class="soft-btn !p-1.5 copy-ticket-btn" data-ticket-id="${esc(ticket.id)}" title="${language === "ar" ? "نسخ رقم التذكرة" : "Copy Ticket ID"}" type="button">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </td>
              <td>${esc(ticket.customer)}</td>
              <td><span class="mono">${esc(ticket.phone)}</span></td>
              <td>${esc(ticket.issue)}</td>
              <td>${displayCategory(ticket.category)}</td>
              <td><span class="badge ${priorityClass(ticket.priority)}">${displayPriority(ticket.priority)}</span></td>
              <td>${esc(ticket.assignee)}</td>
              <td><span class="badge ${statusClass(ticket.status)}">${displayStatus(ticket.status)}</span></td>
              <td>${ticket.createdAt}</td>
              <td>
                <div class="flex items-center gap-1.5">
                  <button class="soft-btn !p-2 open-ticket-detail" data-ticket-id="${esc(ticket.id)}" title="${language === "ar" ? "عرض تفاصيل التذكرة" : "View Ticket Details"}" type="button">
                    <i data-lucide="eye" class="w-4 h-4 text-emerald-700"></i>
                  </button>
                  ${ticket.status !== 'Closed' ? `
                    <button class="soft-btn !p-2 edit-ticket-btn" data-ticket-id="${esc(ticket.id)}" title="${language === "ar" ? "تعديل التذكرة" : "Edit Ticket"}" type="button">
                      <i data-lucide="edit" class="w-4 h-4 text-amber-700"></i>
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `).join("") : `<tr><td colspan="10" class="text-center py-10 text-slate-500">${language === "ar" ? "لا توجد نتائج مطابقة للبحث أو المرشحات." : "No results match your search or filters."}</td></tr>`;
          
          lucide.createIcons();

          body.querySelectorAll(".open-ticket-detail").forEach(button => button.addEventListener("click", () => openTicketModal(button.dataset.ticketId)));
          
          body.querySelectorAll(".edit-ticket-btn").forEach(button => button.addEventListener("click", () => openEditModal(button.dataset.ticketId)));

          body.querySelectorAll(".copy-ticket-btn").forEach(button => button.addEventListener("click", (e) => {
            e.stopPropagation();
            const tid = button.dataset.ticketId;
            navigator.clipboard.writeText(tid).then(() => {
              showToast(language === "ar" ? `تم نسخ رقم التذكرة: ${tid}` : `Ticket ID copied: ${tid}`);
            }).catch(() => {
              showToast(language === "ar" ? "تعذر النسخ للحافظة" : "Failed to copy");
            });
          }));

          if (displayed.length > 0) {
            paginationContainer.innerHTML = `
              <span class="subtle">${language === "ar" ? `عرض ${(start + 1)} إلى ${Math.min(start + pageSize, displayed.length)} من ${displayed.length} تذكرة` : `Showing ${start + 1} to ${Math.min(start + pageSize, displayed.length)} of ${displayed.length} tickets`}</span>
              <div class="flex gap-2 items-center">
                <button class="soft-btn" id="prevPageBtn" ${currentPage === 1 ? "disabled style='opacity:0.5;cursor:not-allowed'" : ""}>${language === "ar" ? "السابق" : "Previous"}</button>
                <span class="subtle font-bold px-2">${currentPage} / ${totalPages}</span>
                <button class="soft-btn" id="nextPageBtn" ${currentPage === totalPages ? "disabled style='opacity:0.5;cursor:not-allowed'" : ""}>${language === "ar" ? "التالي" : "Next"}</button>
              </div>`;

            const prevBtn = document.getElementById("prevPageBtn");
            const nextBtn = document.getElementById("nextPageBtn");

            if (prevBtn && currentPage > 1) {
              prevBtn.addEventListener("click", () => {
                currentPage--;
                drawTickets();
              });
            }
            if (nextBtn && currentPage < totalPages) {
              nextBtn.addEventListener("click", () => {
                currentPage++;
                drawTickets();
              });
            }
          } else {
            paginationContainer.innerHTML = "";
          }
        }

        [search, status, priority, dateFrom, dateTo].forEach(control => control.addEventListener(control === search ? "input" : "change", () => {
          currentPage = 1;
          drawTickets();
        }));
        document.getElementById("exportFilteredTicketsBtn").addEventListener("click", () => exportTickets(filteredTickets()));
        drawTickets();
      }

      // دوال قسم الأرشيف المضافة حديثاً
      function renderArchive(main) {
        main.innerHTML = `
          ${pageHeader(language === "ar" ? "أرشيف التذاكر المغلقة" : "Closed Tickets Archive", language === "ar" ? "استعراض وإدارة التذاكر المغلقة والمؤرشفة" : "Review and manage closed and archived tickets")}
          <section class="card section-card mt-5">
            <div class="filter-grid">
              <div><label class="sr-only" for="archiveSearch">بحث</label><input id="archiveSearch" class="field" placeholder="${language === "ar" ? "بحث في الأرشيف: رقم التذكرة / العميل / المشكلة" : "Search archive: Ticket / Customer / Issue"}"></div>
              <div><label class="sr-only" for="archivePriorityFilter">الأولوية</label><select id="archivePriorityFilter" class="select-field"><option value="">${language === "ar" ? "كل الأولويات" : "All priorities"}</option>${priorityOption("Urgent")}${priorityOption("High")}${priorityOption("Medium")}${priorityOption("Low")}</select></div>
              <button class="primary-btn" id="exportArchiveBtn" type="button"><i data-lucide="download"></i> ${language === "ar" ? "تصدير الأرشيف" : "Export Archive"}</button>
            </div>
          </section>
          <section class="card mt-4 table-wrap">
            <table class="data-table">
              <thead><tr><th>${text("ticket")}</th><th>${text("customer")}</th><th>${text("phone")}</th><th>${text("issue")}</th><th>${language === "ar" ? "التصنيف" : "Category"}</th><th>${text("priority")}</th><th>${text("assignedTo")}</th><th>${language === "ar" ? "تاريخ الإغلاق" : "Closed Date"}</th><th>${text("actions")}</th></tr></thead>
              <tbody id="archiveTableBody"></tbody>

          </section>`;

        const search = document.getElementById("archiveSearch");
        const priorityFilter = document.getElementById("archivePriorityFilter");
        const body = document.getElementById("archiveTableBody");

        function drawArchive() {
          const query = search.value.trim().toLowerCase();
          // تصفية التذاكر المغلقة فقط للأرشيف
          const archivedTickets = tickets.filter(ticket => {
            const searchable = [ticket.id, ticket.customer, ticket.phone, ticket.issue, ticket.assignee].join(" ").toLowerCase();
            return ticket.status === "Closed" &&
              (!query || searchable.includes(query)) &&
              (!priorityFilter.value || ticket.priority === priorityFilter.value);
          });

          body.innerHTML = archivedTickets.length ? archivedTickets.map(ticket => `
            <tr>
              <td><span class="ticket-link mono">${ticket.id}</span></td>
              <td>${esc(ticket.customer)}</td>
              <td><span class="mono">${esc(ticket.phone)}</span></td>
              <td>${esc(ticket.issue)}</td>
              <td>${displayCategory(ticket.category)}</td>
              <td><span class="badge ${priorityClass(ticket.priority)}">${displayPriority(ticket.priority)}</span></td>
              <td>${esc(ticket.assignee)}</td>
              <td>${ticket.closedAt || ticket.createdAt}</td>
              <td>
                <div class="flex items-center gap-1.5">
                  <button class="soft-btn !p-2 open-ticket-detail" data-ticket-id="${esc(ticket.id)}" title="${language === "ar" ? "عرض تفاصيل الأرشيف" : "View Archive Details"}" type="button">
                    <i data-lucide="eye" class="w-4 h-4 text-emerald-700"></i>
                  </button>
                  <button class="soft-btn !p-2 restore-ticket-btn" data-db-id="${esc(ticket.dbId)}" title="${language === "ar" ? "إعادة فتح التذكرة" : "Restore Ticket"}" type="button">
                    <i data-lucide="rotate-ccw" class="w-4 h-4 text-blue-700"></i>
                  </button>
                </div>
              </td>
            </tr>
          `).join("") : `<tr><td colspan="9" class="text-center py-10 text-slate-500">${language === "ar" ? "لا توجد تذاكر مغلقة في الأرشيف حالياً." : "No closed tickets in the archive currently."}</td></tr>`;

          lucide.createIcons();

          body.querySelectorAll(".open-ticket-detail").forEach(button => button.addEventListener("click", () => openTicketModal(button.dataset.ticketId)));
          
          body.querySelectorAll(".restore-ticket-btn").forEach(button => button.addEventListener("click", async () => {
            try {
              const dbId = button.dataset.dbId;
              const update = await supabaseClient.from("tickets").update({
                status: "Open",
                updated_at: new Date().toISOString()
              }).eq("id", dbId);
              if (update.error) throw update.error;
              showToast(language === "ar" ? "تم نقل التذكرة وإعادة فتحها بنجاح." : "Ticket restored successfully.");
              await refreshAndRender("archive");
            } catch (error) {
              await dbError(error);
            }
          }));
        }

        [search, priorityFilter].forEach(control => control.addEventListener(control === search ? "input" : "change", drawArchive));
        document.getElementById("exportArchiveBtn").addEventListener("click", () => {
          const archivedTickets = tickets.filter(t => t.status === "Closed");

          exportCsv(["Ticket", "Customer Name", "Customer Phone", "Issue", "Category", "Priority", "Assigned To", "Closed Date"], rows, "ticket-archive-report.csv");
          showToast(language === "ar" ? "تم تصدير تقرير الأرشيف بنجاح." : "Archive report exported successfully.");

        drawArchive();

              <div><label class="panel-label" for="detailPhonePage">${language === "ar" ? "رقم جوال العميل" : "Customer Phone"}</label><input id="detailPhonePage" class="field mono" value="${esc(ticket.phone)}" readonly></div>
              <div><label class="panel-label" for="detailCategoryPage">${language === "ar" ? "التصنيف" : "Category"}</label><input id="detailCategoryPage" class="field" value="${esc(ticket.category)}" readonly></div>

          try {
            const statusValue = document.getElementById("detailStatusPage").value;
            const assigneeName = document.getElementById("detailAssigneePage").value;
            const assignee = employees.find(e => e.name === assigneeName);
            let closedDate = document.getElementById("detailClosedAtPage").value;
            
            // إذا تم تغيير الحالة إلى مغلقة ولم يُحدد تاريخ الإغلاق، نضع تاريخ اليوم تلقائياً لتسجيلها في الأرشيف
            if (statusValue === "Closed" && !closedDate) {
              closedDate = new Date().toISOString().slice(0, 10);
            }

            const finalResolutionText = document.getElementById("detailFinalResolution").value.trim();
            currentActor = document.getElementById("ticketActorPage").value;
            const reply = document.getElementById("ticketReplyPage").value.trim();
            const replyImage = document.getElementById("ticketReplyAttachmentPage").files[0];

            const auditEntry = { author: currentActor, change: "تحديث التذكرة", from: ticket.status, to: statusValue, at: new Date().toISOString() };
            const nextAudit = Array.isArray(ticket.audit) ? [auditEntry, ...ticket.audit] : [auditEntry];
            const update = await supabaseClient.from("tickets").update({
              status: statusValue,
              assignee_id: assignee?.id || null,
              final_resolution: finalResolutionText,
              final_reply: finalResolutionText,

              audit: nextAudit,
              updated_at: new Date().toISOString()
            }).eq("id", ticket.dbId);
            if (update.error) throw update.error;

            if (reply || replyImage) await addMessage(ticket.dbId, reply, currentActor, replyImage);

            showToast(language === "ar" ? "تم تحديث التذكرة وأرشفتها بنجاح." : "Ticket updated and archived successfully.");

            await dbError(error);

        });

            <article class="card section-card">
              <div class="section-head"><h2>${language === "ar" ? "تحديث التذكرة" : "Update a ticket"}</h2><span class="badge status-open">03</span></div>
              <p class="subtle">${language === "ar" ? "اضغط على رقم التذكرة، ثم حدّث الحالة والموظف المسؤول وتاريخ الإغلاق. أضف رسالة داخلية واختر اسم المرسل، ويمكن إرفاق صورة اختيارية." : "Select a ticket number to update its status, assignee, and closed date. Add an internal message, choose the sender, and optionally attach an image."}</p>
            </article>
            <article class="card section-card">
              <div class="section-head"><h2>${language === "ar" ? "الفريق والتقارير" : "Team and reports"}</h2><span class="badge status-open">04</span></div>
              <p class="subtle">${language === "ar" ? "من الموظفين أضف أعضاء الفريق أو احذف غير المرتبطين بتذاكر. ومن التقارير صفِّ البيانات حسب الحالة أو الموظف ثم صدّر ملخص التصنيفات." : "In Employees, add team members or remove people without assigned tickets. In Reports, filter by status or employee and export category totals."}</p>
            </article>
            <article class="card section-card">
              <div class="section-head"><h2>${language === "ar" ? "الإعدادات واللغة" : "Settings and language"}</h2><span class="badge status-open">05</span></div>
              <p class="subtle">${language === "ar" ? "عدّل قواعد SLA وأضف مصادر التذاكر واختصارات المشاكل من الإعدادات. استخدم زر اللغة في الشريط العلوي للتبديل بين العربية والإنجليزية." : "Adjust SLA rules and manage ticket sources and issue shortcuts in Settings. Use the language button in the top bar to switch between Arabic and English."}</p>
            </article>
          </section>`;
      }

      function renderSettings(main) {
        main.innerHTML = `
          ${pageHeader(language === "ar" ? "الإعدادات" : "Settings", language === "ar" ? "إدارة القيم التشغيلية ولوائح SLA" : "Manage operating values and SLA rules")}
          <section class="card section-card mt-5 max-w-3xl">
            <h2 class="font-extrabold text-base mb-2">${language === "ar" ? "إعدادات اتفاقية مستوى الخدمة" : "SLA Settings"}</h2><p class="subtle">${language === "ar" ? "إعدادات العرض الحالية متاحة لمدير النظام." : "Current display settings are available to the system administrator."}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
              <div><label class="panel-label" for="urgentSla">${displayPriority("Urgent")} — ${language === "ar" ? "ساعات" : "hours"}</label><input id="urgentSla" class="field" type="number" value="${slaSettings.Urgent ?? 1}"></div>
              <div><label class="panel-label" for="highSla">${displayPriority("High")} — ${language === "ar" ? "ساعات" : "hours"}</label><input id="highSla" class="field" type="number" value="${slaSettings.High ?? 4}"></div>
              <div><label class="panel-label" for="mediumSla">${displayPriority("Medium")} — ${language === "ar" ? "ساعات" : "hours"}</label><input id="mediumSla" class="field" type="number" value="${slaSettings.Medium ?? 12}"></div>
              <div><label class="panel-label" for="lowSla">${displayPriority("Low")} — ${language === "ar" ? "ساعات" : "hours"}</label><input id="lowSla" class="field" type="number" value="${slaSettings.Low ?? 24}"></div>
            </div>
            <button id="saveSettings" class="primary-btn mt-5" type="button">${language === "ar" ? "حفظ قواعد SLA" : "Save SLA Rules"}</button>
          </section>
          <section class="card section-card mt-5"><div class="section-head"><h2>${language === "ar" ? "مصادر التذاكر" : "Ticket Sources"}</h2></div>
            <form id="sourceForm" class="flex gap-2 flex-wrap"><label class="sr-only" for="sourceInput">مصدر التذكرة</label><input id="sourceInput" class="field" style="flex:1;min-width:220px" placeholder="${language === "ar" ? "مثال: الهاتف أو البريد الإلكتروني" : "Example: Phone or email"}" required><button class="primary-btn" type="submit"><i data-lucide="plus"></i> ${language === "ar" ? "إضافة مصدر" : "Add source"}</button></form>
            <div id="sourceList" class="mt-4 grid gap-2"></div>
          </section>
          <section class="card section-card mt-5"><div class="section-head"><h2>${language === "ar" ? "اختصارات المشاكل الشائعة" : "Common Issue Shortcuts"}</h2></div>
            <form id="shortcutForm" class="flex gap-2 flex-wrap"><label class="sr-only" for="shortcutInput">ملخص المشكلة الشائعة</label><input id="shortcutInput" class="field" style="flex:1;min-width:220px" placeholder="${language === "ar" ? "مثال: تعذر إتمام الدفع" : "Example: Unable to complete payment"}" required><button class="primary-btn" type="submit"><i data-lucide="plus"></i> ${language === "ar" ? "إضافة" : "Add"}</button></form>
            <div id="shortcutList" class="mt-4 grid gap-2"></div>
          </section>`;

        document.getElementById("saveSettings").addEventListener("click", async () => {
          try {
            const values = {
              Urgent: Number(document.getElementById("urgentSla").value),
              High: Number(document.getElementById("highSla").value),
              Medium: Number(document.getElementById("mediumSla").value),
              Low: Number(document.getElementById("lowSla").value)
            };
            for (const [priority, hours] of Object.entries(values)) {
              const result = await supabaseClient.from("sla_settings").upsert({ priority, hours }, { onConflict: "priority" });
              if (result.error) throw result.error;
            }
            showToast(language === "ar" ? "تم تحديث قواعد SLA." : "SLA rules updated.");
          } catch (error) { await dbError(error); }
        });

        function bindList(listId, items, deleteClass) {
          const list = document.getElementById(listId);
          const draw = () => {
            list.innerHTML = items.map((item, index) => `<div class="flex items-center justify-between gap-3 border-b border-slate-100 py-2"><span>${esc(item)}</span><button class="soft-btn ${deleteClass}" data-index="${index}" type="button"><i data-lucide="trash-2"></i> ${language === "ar" ? "حذف" : "Delete"}</button></div>`).join("");
            lucide.createIcons();
            list.querySelectorAll("." + deleteClass).forEach(button => button.addEventListener("click", async () => {
              try {
                const index = Number(button.dataset.index);
                if (deleteClass === "delete-source") {
                  const row = (await supabaseClient.from("ticket_sources").select("id").eq("name", items[index]).maybeSingle());
                  if (row.error) throw row.error;
                  if (row.data) {
                    const result = await supabaseClient.from("ticket_sources").update({ is_active: false }).eq("id", row.data.id);
                    if (result.error) throw result.error;
                  }
                } else {
                  const row = (await supabaseClient.from("issue_shortcuts").select("id").eq("label", items[index]).maybeSingle());
                  if (row.error) throw row.error;
                  if (row.data) {
                    const result = await supabaseClient.from("issue_shortcuts").update({ is_active: false }).eq("id", row.data.id);
                    if (result.error) throw result.error;
                  }
                }
                await refreshAndRender("settings");
              } catch (error) { await dbError(error); }
            }));
          };
          draw();
        }

        document.getElementById("sourceForm").addEventListener("submit", async event => {
          event.preventDefault();
          try {
            const name = document.getElementById("sourceInput").value.trim();
            if (!name || ticketSources.includes(name)) return;
            const result = await supabaseClient.from("ticket_sources").insert({ name, created_by: currentUser?.id || null });
            if (result.error) throw result.error;
            event.target.reset();
            await refreshAndRender("settings");
            showToast(language === "ar" ? "تمت إضافة مصدر التذكرة." : "Ticket source added.");
          } catch (error) { await dbError(error); }
        });

        document.getElementById("shortcutForm").addEventListener("submit", async event => {
          event.preventDefault();
          try {
            const label = document.getElementById("shortcutInput").value.trim();
            if (!label || issueShortcuts.includes(label)) return;
            const result = await supabaseClient.from("issue_shortcuts").insert({ label, created_by: currentUser?.id || null });
            if (result.error) throw result.error;
            event.target.reset();
            await refreshAndRender("settings");
            showToast(language === "ar" ? "تمت إضافة اختصار المشكلة." : "Issue shortcut added.");
          } catch (error) { await dbError(error); }
        });

        bindList("sourceList", ticketSources, "delete-source");
        bindList("shortcutList", issueShortcuts, "delete-shortcut");
      }

      function exportCsv(headers, rows, filename) {
        const csv = "\uFEFF" + [headers, ...rows].map(row => row.map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      }

      function exportTickets(sourceTickets) {
        const rows = sourceTickets.map(ticket => [ticket.id, ticket.customer, ticket.phone, ticket.issue, ticket.category, ticket.priority, ticket.assignee, ticket.status, ticket.createdAt]);
        exportCsv(["Ticket", "Customer Name", "Customer Phone", "Issue", "Category", "Priority", "Assigned To", "Status", "Created At"], rows, "customer-service-tickets.csv");
        showToast(language === "ar" ? "تم تصدير تقرير التذاكر بنجاح." : "Ticket report exported successfully.");
      }

      function openCreateModal() {
        document.body.classList.add("create-ticket-mode");
        currentView = "create-ticket";
        render();
        requestAnimationFrame(() => {
          const screen = document.querySelector(".create-ticket-screen");
          if (screen) screen.scrollTop = 0;
          window.scrollTo(0, 0);
        });
      }

      function renderCreateTicket(main) {
        main.innerHTML = `
          <div class="create-ticket-screen">
            <div class="create-ticket-inner">
              <div class="flex items-center justify-between gap-4 flex-wrap">
                ${pageHeader(language === "ar" ? "إنشاء تذكرة" : "Create Ticket", language === "ar" ? "إضافة تذكرة جديدة وتعبئة جميع البيانات المطلوبة" : "Create a new ticket and fill in the required details")}
                <button class="soft-btn" id="cancelCreateTicket" type="button"><i data-lucide="arrow-right"></i> ${language === "ar" ? "العودة إلى التذاكر" : "Back to Tickets"}</button>
              </div>
              <section class="create-ticket-card">
            <form id="ticketForm">
              <div class="form-grid">
                <div><label class="panel-label" for="customerName">${language === "ar" ? "اسم العميل *" : "Customer Name *"}</label><input id="customerName" class="field" required></div>
                <div><label class="panel-label" for="customerPhone">${language === "ar" ? "رقم جوال العميل *" : "Customer Phone *"}</label><input id="customerPhone" class="field mono" type="tel" placeholder="05xxxxxxxx" required></div>
                <div><label class="panel-label" for="ticketShortcut">${language === "ar" ? "اختصار المشكلة" : "Issue Shortcut"}</label><select id="ticketShortcut" class="select-field"><option value="">${language === "ar" ? "اختيار اختصار أو كتابة ملخص جديد" : "Choose shortcut or write a new summary"}</option>${issueShortcuts.map(shortcut => `<option value="${esc(shortcut)}">${esc(shortcut)}</option>`).join("")}</select></div>
                <div><label class="panel-label" for="ticketIssue">${language === "ar" ? "ملخص المشكلة *" : "Issue Summary *"}</label><input id="ticketIssue" class="field" required></div>
                <div><label class="panel-label" for="ticketCategory">${language === "ar" ? "التصنيف *" : "Category *"}</label><select id="ticketCategory" class="select-field" required><option value="Payment">${displayCategory("Payment")}</option><option value="Coupon">${displayCategory("Coupon")}</option><option value="Refund">${displayCategory("Refund")}</option><option value="Wallet">${displayCategory("Wallet")}</option><option value="Other">${displayCategory("Other")}</option></select></div>
                <div><label class="panel-label" for="ticketPriority">${language === "ar" ? "الأولوية *" : "Priority *"}</label><select id="ticketPriority" class="select-field"><option>Medium</option><option>Low</option><option>High</option><option>Urgent</option></select></div>
                <div><label class="panel-label" for="ticketSource">${language === "ar" ? "مصدر التذكرة *" : "Ticket Source *"}</label><select id="ticketSource" class="select-field" required><option value="">${language === "ar" ? "اختيار مصدر التذكرة" : "Choose ticket source"}</option>${ticketSources.map(source => `<option>${esc(source)}</option>`).join("")}</select></div>
                <div><label class="panel-label" for="ticketAssignee">${language === "ar" ? "الموظف المسؤول *" : "Assigned Employee *"}</label><select id="ticketAssignee" class="select-field">${employees.map(employee => `<option>${esc(employee.name)}</option>`).join("")}</select></div>
                <div class="form-full"><label class="panel-label" for="ticketDescription">${language === "ar" ? "وصف المشكلة *" : "Issue Description *"}</label><textarea id="ticketDescription" class="field min-h-24" required></textarea></div>
                <div class="form-full"><label class="panel-label" for="ticketAttachments">${language === "ar" ? "المرفقات (اختياري)" : "Attachments (optional)"}</label><input id="ticketAttachments" class="field" type="file" multiple><p class="subtle">${language === "ar" ? "يمكنك اختيار أكثر من ملف." : "You can choose multiple files."}</p></div>
              </div>
              <div class="flex gap-2 mt-5 flex-wrap">
                <button class="primary-btn" type="submit">${language === "ar" ? "إنشاء التذكرة" : "Create Ticket"}</button>
                <button class="soft-btn" id="cancelCreateTicketBottom" type="button">${language === "ar" ? "إلغاء" : "Cancel"}</button>
              </div>
            </form>
              </section>
            </div>
          </div>`;

        const back = () => {
          document.body.classList.remove("create-ticket-mode");
          currentView = "tickets";
          render();
          window.scrollTo(0, 0);
        };
        document.getElementById("cancelCreateTicket").addEventListener("click", back);
        document.getElementById("cancelCreateTicketBottom").addEventListener("click", back);
        document.getElementById("ticketShortcut").addEventListener("change", event => {
          if (event.target.value) document.getElementById("ticketIssue").value = event.target.value;
        });
        document.getElementById("ticketForm").addEventListener("submit", async event => {
          event.preventDefault();
          try {
            const assigneeName = document.getElementById("ticketAssignee").value;
            const assignee = employees.find(e => e.name === assigneeName);
            const payload = {
              customer_name: document.getElementById("customerName").value.trim(),
              customer_phone: document.getElementById("customerPhone").value.trim(),
              issue_summary: document.getElementById("ticketIssue").value.trim(),
              issue_description: document.getElementById("ticketDescription").value.trim(),
              category: document.getElementById("ticketCategory").value,
              source: document.getElementById("ticketSource").value,
              priority: document.getElementById("ticketPriority").value,
              assignee_id: assignee?.id || null,
              status: "New",
              created_by: currentUser?.id || null
            };
            const inserted = await supabaseClient.from("tickets").insert(payload).select("id,ticket_number").single();
            if (inserted.error) throw inserted.error;
            await uploadTicketFiles(inserted.data.id, document.getElementById("ticketAttachments").files);
            await refreshAndRender("tickets");
            showToast(language === "ar" ? "تم إنشاء التذكرة بنجاح." : "Ticket created successfully.");
          } catch (error) { await dbError(error); }
        });
      }

      function render() {
        document.querySelectorAll(".nav-link").forEach(button => button.classList.toggle("active", button.dataset.view === currentView));
        const main = document.getElementById("appMain");
        if (currentView === "create-ticket") renderCreateTicket(main);
        if (currentView === "dashboard") renderDashboard(main);
        if (currentView === "tickets") renderTickets(main);
        if (currentView === "archive") renderArchive(main); // استدعاء دالة الأرشيف
        if (currentView === "ticket-detail") renderTicketDetail(main);
        if (currentView === "employees") renderEmployees(main);
        if (currentView === "reports") renderReports(main);
        if (currentView === "settings") renderSettings(main);
        if (currentView === "guide") renderGuide(main);
        applyLanguageChrome();
        lucide.createIcons();
      }

      document.querySelectorAll(".nav-link").forEach(button => button.addEventListener("click", () => {
        currentView = button.dataset.view;
        document.getElementById("sidebar").classList.remove("open");
        render();
      }));

      document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
      document.getElementById("createTicketBtn").addEventListener("click", openCreateModal);
      document.getElementById("languageToggle").addEventListener("click", () => {
        language = language === "ar" ? "en" : "ar";
        render();
      });

      (async () => {
        try {
          await loadData();
          render();
        } catch (error) {
          await dbError(error);
        }
      })();
    })();
  </script>
 
</body></html>
