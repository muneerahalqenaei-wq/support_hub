      --mist: #f4f8f5;
      --line: #d9e5dd;
      --ink: #17281e;
      --muted: #637067;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: Tahoma, "Libre Franklin", sans-serif;
      color: var(--ink);

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible,

    select:focus-visible,

      outline-offset: 2px;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      display: flex;
    }

    .side-nav {

      top: 0;
      right: 0;
      bottom: 0;
      width: 270px;
      overflow-y: auto;
      padding: 26px 16px;
      color: #ffffff;
      background: var(--teal);
      box-shadow: -8px 0 26px #0000001a;

    .brand {
      display: flex;

    .brand-mark {

      height: 42px;
      color: #000000;
      background: var(--gold);
      border-radius: 13px;
      place-items: center;

    .brand-subtitle {

      color: #e3f3ee;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;

    .nav-link {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
      padding: 12px 13px;
      color: #e5f4f0;
      text-align: right;
      background: transparent;
      border: 0;
      border-radius: 10px;
      transition: .18s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #ffffff;
      background: #ffffff22;
    }

    .nav-link.active {
      box-shadow: inset -3px 0 var(--gold);

    .topbar {

      z-index: 20;
      display: flex;
      width: 100%;
      min-height: 76px;

      gap: 16px;
      padding: 14px 30px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .page-body {
      width: 100%;
      padding: 28px 30px 50px;
    }

    .view-title {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .subtle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .primary-btn,
    .soft-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 700;
      border: 0;
      border-radius: 10px;
      transition: .18s ease;
    }

    .primary-btn {
      color: #ffffff;
      background: var(--teal);
    }

    .primary-btn:hover { background: var(--teal-dark); }

    .soft-btn {
      color: #216f67;
      background: #e8f2ed;
    }

    .soft-btn:hover { background: #d6e8dd; }

    .card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 5px 18px #133a240a;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .metric {
      min-height: 112px;
      padding: 17px;
      border-top: 4px solid #c9ddd2;

    .metric.gold { border-top-color: var(--gold); }
    .metric.green { border-top-color: #28a77a; }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .metric-number {
      margin-top: 9px;
      font-size: 27px;
      font-weight: 800;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.35fr .9fr;
      gap: 18px;
      margin-top: 18px;
    }

    .section-card { padding: 20px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 115px 1fr 28px;
      gap: 10px;
      align-items: center;
      margin: 13px 0;
      font-size: 12px;
    }

    .track {
      height: 9px;
      overflow: hidden;
      background: #edf3ef;
      border-radius: 10px;
    }

      height: 100%;
      background: var(--olive);
      border-radius: 10px;
    }

    .select-field {
      width: 100%;

      font-size: 13px;
      background: #ffffff;

      border-color: var(--teal);
      box-shadow: 0 0 0 3px #268F8520;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr repeat(2, 1fr);
      gap: 10px;
    }

    .table-wrap { overflow-x: auto; }

    .data-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    .data-table th {
      padding: 13px 12px;
      color: #607067;
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
      background: #f7faf8;
      border-bottom: 1px solid var(--line);

      background: transparent;
      border: 0;

      font-size: 11px;
      font-weight: 700;

    .status-pending { color: #7651a9; background: #f4edff; }
    .status-resolved { color: #16845e; background: #dcf8ed; }
    .priority-urgent { color: #c73636; background: #ffebeb; }

    .priority-medium { color: #326bc0; background: #eaf2ff; }
    .priority-low { color: #247e55; background: #e7f7ee; }

    .modal-backdrop {
      position: fixed;

      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #0a2824a3;
    }

    /*
      The modal uses a fixed maximum viewport height and flex layout.
      Only modal-body scrolls, so the footer action buttons remain visible
      on short mobile screens and while the keyboard is open.
    */
    .modal {
      display: flex;
      width: min(650px, 100%);
      max-height: calc(100 * min(var(--vh, 1vh), 1vh) - 36px);
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0004;
    }

    .modal-head,
    .modal-foot {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      background: #ffffff;
    }

    .modal-head { border-bottom: 1px solid var(--line); }

    .modal-foot {
      justify-content: flex-start;
      border-top: 1px solid var(--line);
      box-shadow: 0 -8px 18px #17392a0d;
    }

    .modal-form {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      flex-direction: column;
    }

    .modal-body {
      min-height: 0;
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-full { grid-column: 1 / -1; }

    .panel-label {
      display: block;
      margin-bottom: 7px;
      color: #53655a;
      font-size: 11px;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 25px;
      z-index: 100;
      max-width: min(360px, calc(100% - 50px));
      padding: 13px 17px;
      color: #ffffff;
      font-size: 13px;
      background: var(--teal);
      border-right: 4px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 10px 28px #00000033;
      opacity: 0;
      transform: translateY(110px);
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden { display: none !important; }
    .mobile-menu { display: none; }

    body[dir="ltr"] .side-nav {
      right: auto;
      left: 0;
      box-shadow: 8px 0 26px #0000001a;
    }

    body[dir="ltr"] .main-area {
      margin-right: 0;
      margin-left: 270px;
    }

    body[dir="ltr"] .nav-link { text-align: left; }
    body[dir="ltr"] .nav-link.active { box-shadow: inset 3px 0 var(--gold); }
    body[dir="ltr"] .data-table th { text-align: left; }

    @media (max-width: 1100px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .side-nav {
        transform: translateX(100%);

      body[dir="ltr"] .side-nav { transform: translateX(-100%); }
      .side-nav.open { transform: translateX(0); }

      .main-area,
      body[dir="ltr"] .main-area {
        width: 100%;
        margin-right: 0;
        margin-left: 0;
      }

      .topbar { padding: 13px 16px; }
      .page-body { padding: 20px 15px 40px; }
      .view-title { font-size: 20px; }
      .mobile-menu { display: inline-flex; }
      .filter-grid,
      .form-grid { grid-template-columns: 1fr; }

      .form-full { grid-column: auto; }

      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        width: 100%;
        max-height: calc(100 * min(var(--vh, 1vh), 1vh) - 8px);
        border-radius: 20px 20px 0 0;
      }

      .modal-head,
      .modal-foot {
        padding: 15px 16px;
      }

      .modal-body { padding: 16px; }

      .modal-foot {
        position: relative;
        padding-bottom: max(15px, env(safe-area-inset-bottom));
      }

      .modal-foot .primary-btn,
      .modal-foot .soft-btn {
        flex: 1;
        min-height: 44px;
      }

        search: "بحث: التذكرة / العميل / المشكلة",
        allStatuses: "كل الحالات",
        allPriorities: "كل الأولويات",
        export: "تصدير النتائج",
        customer: "العميل",
        issue: "المشكلة",
        category: "التصنيف",
        priority: "الأولوية",
        assignee: "الموظف المسؤول",
        status: "الحالة",
        created: "تاريخ الإنشاء",
        cancel: "إلغاء",
        createTicket: "إنشاء التذكرة",
        customerName: "اسم العميل *",
        issueSummary: "ملخص المشكلة *",
        description: "وصف المشكلة *",
        source: "مصدر التذكرة",
        chooseSource: "اختيار مصدر التذكرة",
        details: "تفاصيل التذكرة",
        save: "حفظ التحديثات",
        note: "إضافة تحديث داخلي",
        language: "English"
      };

      const en = {
        dashboard: "Dashboard",
        tickets: "Tickets",
        employees: "Employees",
        reports: "Reports",
        settings: "Settings",
        guide: "User Guide",
        create: "Create Ticket",
        overview: "Real-time customer service ticket tracking",
        allTickets: "All Tickets",
        ticketDescription: "Search, sort, and filter customer service tickets",
        total: "Total Tickets",
        open: "Open",
        progress: "In Progress",
        pending: "Pending",
        urgent: "Urgent",
        resolved: "Resolved",
        byStatus: "Tickets by Status",
        sla: "SLA Alerts",
        search: "Search: Ticket / Customer / Issue",
        allStatuses: "All statuses",
        allPriorities: "All priorities",
        export: "Export Results",
        customer: "Customer",
        issue: "Issue",
        category: "Category",
        priority: "Priority",
        assignee: "Assigned To",
        status: "Status",
        created: "Created At",
        cancel: "Cancel",
        createTicket: "Create Ticket",
        customerName: "Customer Name *",
        issueSummary: "Issue Summary *",
        description: "Issue Description *",
        source: "Ticket Source",
        chooseSource: "Choose ticket source",
        details: "Ticket Details",
        save: "Save Updates",
        note: "Add Internal Update",
        language: "العربية"
      };

      function t(key) {
        return (language === "ar" ? ar : en)[key] || key;
      }

      function esc(value) {
        return String(value || "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function statusLabel(status) {
        const map = {
          "New": language === "ar" ? "جديدة" : "New",
          "Open": language === "ar" ? "مفتوحة" : "Open",
          "In Progress": language === "ar" ? "قيد المعالجة" : "In Progress",
          "Pending Customer": language === "ar" ? "بانتظار العميل" : "Pending Customer",
          "Resolved": language === "ar" ? "محلولة" : "Resolved",
          "Closed": language === "ar" ? "مغلقة" : "Closed"
        };
        return map[status] || status;
      }

      function priorityLabel(priority) {
        const map = {
          Urgent: language === "ar" ? "عاجلة" : "Urgent",
          High: language === "ar" ? "عالية" : "High",
          Medium: language === "ar" ? "متوسطة" : "Medium",
          Low: language === "ar" ? "منخفضة" : "Low"
        };
        return map[priority] || priority;
      }

      function statusClass(status) {
        if (status === "New") return "status-new";
        if (status === "Open") return "status-open";
        if (status === "In Progress") return "status-progress";
        if (status === "Pending Customer") return "status-pending";
        return "status-resolved";
      }

      function priorityClass(priority) {
        return "priority-" + priority.toLowerCase();
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
      }

      function applyLanguageChrome() {
        document.documentElement.lang = language === "ar" ? "ar" : "en";
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        document.body.dir = document.documentElement.dir;

        document.querySelector('[data-template-id="language-toggle"]').textContent = t("language");
        document.querySelector('[data-template-id="nav-dashboard"]').textContent = t("dashboard");
        document.querySelector('[data-template-id="nav-tickets"]').textContent = t("tickets");
        document.querySelector('[data-template-id="nav-employees"]').textContent = t("employees");
        document.querySelector('[data-template-id="nav-reports"]').textContent = t("reports");
        document.querySelector('[data-template-id="nav-settings"]').textContent = t("settings");
        document.querySelector('[data-template-id="nav-guide"]').textContent = t("guide");
        document.querySelector('[data-template-id="create-ticket-label"]').textContent = t("create");
      }

      function pageHeader(title, subtitle) {
        return `
          <section>
            <h1 class="view-title">${title}</h1>
            <p class="subtle">${subtitle}</p>
          </section>
        `;
      }

      function metric(label, number, accent = "") {
        return `
          <article class="card metric ${accent}">
            <div class="metric-label">${label}</div>
            <div class="metric-number">${number}</div>
          </article>
        `;
      }

      function chart(label, amount, total) {
        const width = Math.max(5, Math.round((amount / Math.max(total, 1)) * 100));
        return `
          <div class="chart-row">
            <span>${label}</span>
            <div class="track"><div class="bar" style="width:${width}%"></div></div>
            <b>${amount}</b>
          </div>
        `;
      }

      function renderDashboard(main) {
        const openCount = tickets.filter(ticket => ticket.status === "Open").length;
        const progressCount = tickets.filter(ticket => ticket.status === "In Progress").length;
        const pendingCount = tickets.filter(ticket => ticket.status === "Pending Customer").length;
        const urgentCount = tickets.filter(ticket => ticket.priority === "Urgent").length;
        const resolvedCount = tickets.filter(ticket => ticket.status === "Resolved").length;

        main.innerHTML = `
          ${pageHeader(t("dashboard"), t("overview"))}
          <section class="summary-grid">
            ${metric(t("total"), tickets.length)}
            ${metric(t("open"), openCount)}
            ${metric(t("progress"), progressCount, "gold")}
            ${metric(t("pending"), pendingCount)}
            ${metric(t("urgent"), urgentCount, "urgent")}
            ${metric(t("resolved"), resolvedCount, "green")}
          </section>

          <section class="dashboard-grid">
            <article class="card section-card">
              <div class="section-head">
                <h2>${t("byStatus")}</h2>
                <span class="subtle">${language === "ar" ? "تحديث مباشر" : "Live update"}</span>
              </div>
              ${chart(statusLabel("New"), tickets.filter(x => x.status === "New").length, tickets.length)}
              ${chart(statusLabel("Open"), openCount, tickets.length)}
              ${chart(statusLabel("In Progress"), progressCount, tickets.length)}
              ${chart(statusLabel("Pending Customer"), pendingCount, tickets.length)}
              ${chart(statusLabel("Resolved"), resolvedCount, tickets.length)}
            </article>

            <article class="card section-card">
              <div class="section-head">
                <h2>${t("sla")}</h2>
                <span class="badge priority-urgent">${urgentCount} ${t("urgent")}</span>
              </div>
              ${tickets.slice(0, 4).map(ticket => `
                <button class="ticket-link open-ticket w-full border-b border-slate-100 py-3 text-right" data-ticket-id="${ticket.id}" type="button">
                  <span dir="ltr">${ticket.id}</span><br>
                  <span class="font-normal text-slate-500">${esc(ticket.issue)}</span>
                </button>
              `).join("")}
            </article>
          </section>
        `;

        main.querySelectorAll(".open-ticket").forEach(button => {
          button.addEventListener("click", () => openTicketDetail(button.dataset.ticketId));
        });
      }

      function renderTickets(main) {
        main.innerHTML = `
          ${pageHeader(t("allTickets"), t("ticketDescription"))}

          <section class="card section-card mt-5">
            <div class="filter-grid">
              <div>
                <label class="sr-only" for="ticketSearch">${t("search")}</label>
                <input id="ticketSearch" class="field" type="search" placeholder="${t("search")}">
              </div>
              <div>
                <label class="sr-only" for="statusFilter">${t("status")}</label>
                <select id="statusFilter" class="select-field">
                  <option value="">${t("allStatuses")}</option>
                  <option value="New">${statusLabel("New")}</option>
                  <option value="Open">${statusLabel("Open")}</option>
                  <option value="In Progress">${statusLabel("In Progress")}</option>
                  <option value="Pending Customer">${statusLabel("Pending Customer")}</option>
                  <option value="Resolved">${statusLabel("Resolved")}</option>
                </select>
              </div>
              <div>
                <label class="sr-only" for="priorityFilter">${t("priority")}</label>
                <select id="priorityFilter" class="select-field">
                  <option value="">${t("allPriorities")}</option>
                  <option value="Urgent">${priorityLabel("Urgent")}</option>
                  <option value="High">${priorityLabel("High")}</option>
                  <option value="Medium">${priorityLabel("Medium")}</option>
                  <option value="Low">${priorityLabel("Low")}</option>
                </select>
              </div>
            </div>
          </section>

          <section class="card mt-4 table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>${language === "ar" ? "التذكرة" : "Ticket"}</th>
                  <th>${t("customer")}</th>
                  <th>${t("issue")}</th>
                  <th>${t("priority")}</th>
                  <th>${t("assignee")}</th>
                  <th>${t("status")}</th>
                  <th>${t("created")}</th>
                </tr>
              </thead>
              <tbody id="ticketTableBody"></tbody>
            </table>
          </section>
        `;

        const search = document.getElementById("ticketSearch");
        const status = document.getElementById("statusFilter");
        const priority = document.getElementById("priorityFilter");
        const body = document.getElementById("ticketTableBody");

        function draw() {
          const query = search.value.trim().toLowerCase();

          const filtered = tickets.filter(ticket => {
            const text = `${ticket.id} ${ticket.customer} ${ticket.issue} ${ticket.assignee}`.toLowerCase();
            return (!query || text.includes(query)) &&
              (!status.value || ticket.status === status.value) &&
              (!priority.value || ticket.priority === priority.value);
          });

          body.innerHTML = filtered.length ? filtered.map(ticket => `
            <tr>
              <td>
                <button class="ticket-link open-ticket" dir="ltr" data-ticket-id="${ticket.id}" type="button">${ticket.id}</button>
              </td>
              <td>${esc(ticket.customer)}</td>
              <td>${esc(ticket.issue)}</td>
              <td><span class="badge ${priorityClass(ticket.priority)}">${priorityLabel(ticket.priority)}</span></td>
              <td>${esc(ticket.assignee)}</td>
              <td><span class="badge ${statusClass(ticket.status)}">${statusLabel(ticket.status)}</span></td>
              <td dir="ltr">${ticket.createdAt}</td>
            </tr>
          `).join("") : `
            <tr>
              <td colspan="7" class="py-10 text-center text-slate-500">
                ${language === "ar" ? "لا توجد نتائج مطابقة." : "No matching results."}
              </td>
            </tr>
          `;

          body.querySelectorAll(".open-ticket").forEach(button => {
            button.addEventListener("click", () => openTicketDetail(button.dataset.ticketId));
          });
        }

        search.addEventListener("input", draw);
        status.addEventListener("change", draw);
        priority.addEventListener("change", draw);
        draw();
      }

      function renderPlaceholder(main, icon, title, text) {
        main.innerHTML = `
          ${pageHeader(title, text)}
          <section class="card section-card mt-5 text-center">
            <i data-lucide="${icon}" class="mx-auto mb-4" style="width:42px;height:42px;color:#268F85"></i>
            <p class="subtle">${text}</p>
          </section>
        `;
      }

      function renderTicketDetail(main) {
        const ticket = tickets.find(item => item.id === selectedTicketId);

        if (!ticket) {
          currentView = "tickets";
          render();
          return;
        }

        main.innerHTML = `
          <div class="flex flex-wrap items-start justify-between gap-4">
            ${pageHeader(t("details"), ticket.issue)}
            <button class="soft-btn" id="backToTickets" type="button">
              <i data-lucide="arrow-right"></i>
              ${language === "ar" ? "العودة إلى التذاكر" : "Back to Tickets"}
            </button>
          </div>

          <section class="card section-card mt-5">
            <div class="section-head">
              <div>
                <h2 dir="ltr">${ticket.id}</h2>
                <p class="subtle">${esc(ticket.customer)}</p>
              </div>
              <span class="badge ${statusClass(ticket.status)}">${statusLabel(ticket.status)}</span>
            </div>

            <form id="ticketDetailForm">
              <div class="form-grid">
                <div>
                  <label class="panel-label" for="detailStatus">${t("status")}</label>
                  <select id="detailStatus" class="select-field">
                    ${["New", "Open", "In Progress", "Pending Customer", "Resolved", "Closed"].map(status => `
                      <option value="${status}" ${ticket.status === status ? "selected" : ""}>${statusLabel(status)}</option>
                    `).join("")}
                  </select>
                </div>

                <div>
                  <label class="panel-label" for="detailAssignee">${t("assignee")}</label>
                  <select id="detailAssignee" class="select-field">
                    ${employees.map(employee => `
                      <option value="${esc(employee.name)}" ${ticket.assignee === employee.name ? "selected" : ""}>
                        ${esc(employee.name)}
                      </option>
                    `).join("")}
                  </select>
                </div>

                <div class="form-full">
                  <label class="panel-label" for="ticketNote">${t("note")}</label>
                  <textarea id="ticketNote" class="field" rows="4" placeholder="${language === "ar" ? "اكتب تحديثاً للفريق..." : "Write an update for the team..."}"></textarea>
                </div>
              </div>

              <div class="section-head mt-7">
                <h2>${language === "ar" ? "سجل التواصل الداخلي" : "Internal activity"}</h2>
              </div>

              <div class="grid gap-3">
                ${ticket.messages.length ? ticket.messages.map(message => `
                  <article class="rounded-lg border border-slate-100 bg-emerald-50 p-3">
                    <strong>${esc(message.author)}</strong>
                    <p class="subtle">${esc(message.text)}</p>
                  </article>
                `).join("") : `
                  <p class="subtle">${language === "ar" ? "لا توجد ردود مسجلة بعد." : "No updates recorded yet."}</p>
                `}
              </div>

              <div class="mt-5 flex flex-wrap gap-2">
                <button class="primary-btn" type="submit">${t("save")}</button>
                <button class="soft-btn" id="cancelTicketDetail" type="button">${t("cancel")}</button>
              </div>
            </form>
          </section>
        `;

        document.getElementById("backToTickets").addEventListener("click", () => {
          currentView = "tickets";
          render();
        });

        document.getElementById("cancelTicketDetail").addEventListener("click", () => {
          currentView = "tickets";
          render();
        });

        document.getElementById("ticketDetailForm").addEventListener("submit", event => {
          event.preventDefault();

          ticket.status = document.getElementById("detailStatus").value;
          ticket.assignee = document.getElementById("detailAssignee").value;

          const note = document.getElementById("ticketNote").value.trim();
          if (note) {
            ticket.messages.push({
              author: language === "ar" ? "المدير" : "Admin",
              text: note
            });
          }

          showToast(language === "ar" ? "تم تحديث التذكرة بنجاح." : "Ticket updated successfully.");
          render();
        });
      }

      function openTicketDetail(ticketId) {
        selectedTicketId = ticketId;
        currentView = "ticket-detail";
        render();
      }

      function openCreateModal() {
        const modalRoot = document.getElementById("modalRoot");

        modalRoot.innerHTML = `
          <div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="createTicketTitle">
            <section class="modal">
              <header class="modal-head">
                <div>
                  <h2 id="createTicketTitle" class="m-0 text-lg font-extrabold">${t("createTicket")}</h2>
                  <p class="subtle">${language === "ar" ? "أدخل بيانات الطلب ثم أنشئ التذكرة." : "Enter request information and create the ticket."}</p>
                </div>
                <button class="soft-btn" id="closeCreateModal" type="button" aria-label="إغلاق">
                  <i data-lucide="x"></i>
                </button>
              </header>

              <form id="ticketForm" class="modal-form">
                <div class="modal-body">
                  <div class="form-grid">
                    <div>
                      <label class="panel-label" for="customerName">${t("customerName")}</label>
                      <input id="customerName" class="field" required>
                    </div>

                    <div>
                      <label class="panel-label" for="ticketPriority">${t("priority")}</label>
                      <select id="ticketPriority" class="select-field">
                        <option value="Medium">${priorityLabel("Medium")}</option>
                        <option value="Low">${priorityLabel("Low")}</option>
                        <option value="High">${priorityLabel("High")}</option>
                        <option value="Urgent">${priorityLabel("Urgent")}</option>
                      </select>
                    </div>

                    <div>
                      <label class="panel-label" for="ticketIssue">${t("issueSummary")}</label>
                      <input id="ticketIssue" class="field" required>
                    </div>

                    <div>
                      <label class="panel-label" for="ticketAssignee">${t("assignee")}</label>
                      <select id="ticketAssignee" class="select-field">
                        ${employees.map(employee => `<option value="${esc(employee.name)}">${esc(employee.name)}</option>`).join("")}
                      </select>
                    </div>

                    <div>
                      <label class="panel-label" for="ticketSource">${t("source")}</label>
                      <select id="ticketSource" class="select-field">
                        <option value="Email">${language === "ar" ? "البريد الإلكتروني" : "Email"}</option>
                        <option value="Phone">${language === "ar" ? "الهاتف" : "Phone"}</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Website">${language === "ar" ? "الموقع الإلكتروني" : "Website"}</option>
                      </select>
                    </div>

                    <div>
                      <label class="panel-label" for="ticketCategory">${t("category")}</label>
                      <select id="ticketCategory" class="select-field">
                        <option value="Other">${language === "ar" ? "أخرى" : "Other"}</option>
                        <option value="Payment">${language === "ar" ? "الدفع" : "Payment"}</option>
                        <option value="Coupon">${language === "ar" ? "القسائم" : "Coupon"}</option>
                        <option value="Refund">${language === "ar" ? "الاسترداد" : "Refund"}</option>
                        <option value="Wallet">${language === "ar" ? "المحفظة" : "Wallet"}</option>
                      </select>
                    </div>

                    <div class="form-full">
                      <label class="panel-label" for="ticketDescription">${t("description")}</label>
                      <textarea id="ticketDescription" class="field" rows="7" required></textarea>
                    </div>
                  </div>
                </div>

                <footer class="modal-foot">
                  <button class="canva-button primary-btn" type="submit">${t("createTicket")}</button>
                  <button class="canva-button soft-btn" id="cancelCreateModal" type="button">${t("cancel")}</button>
                </footer>
              </form>
            </section>
          </div>
        `;

        const close = () => {
          modalRoot.innerHTML = "";
        };

        document.getElementById("closeCreateModal").addEventListener("click", close);
        document.getElementById("cancelCreateModal").addEventListener("click", close);

        document.getElementById("ticketForm").addEventListener("submit", event => {
          event.preventDefault();

          const ticket = {
            id: `TKT-2026-${String(tickets.length + 1).padStart(6, "0")}`,
            customer: document.getElementById("customerName").value.trim(),
            issue: document.getElementById("ticketIssue").value.trim(),
            category: document.getElementById("ticketCategory").value,
            priority: document.getElementById("ticketPriority").value,
            assignee: document.getElementById("ticketAssignee").value,
            status: "New",
            createdAt: new Date().toISOString().slice(0, 10),
            messages: [{
              author: language === "ar" ? "المدير" : "Admin",
              text: document.getElementById("ticketDescription").value.trim()
            }]
          };

          tickets.unshift(ticket);
          close();
          currentView = "tickets";
          render();
          showToast(language === "ar" ? "تم إنشاء التذكرة بنجاح." : "Ticket created successfully.");
        });

        lucide.createIcons();
      }

      function render() {
        document.querySelectorAll(".nav-link").forEach(button => {
          button.classList.toggle("active", button.dataset.view === currentView);
        });

        const main = document.getElementById("appMain");

        if (currentView === "dashboard") renderDashboard(main);
        if (currentView === "tickets") renderTickets(main);
        if (currentView === "ticket-detail") renderTicketDetail(main);
        if (currentView === "employees") {
          renderPlaceholder(main, "users", t("employees"), language === "ar" ? "يمكنك إدارة أعضاء فريق خدمة العملاء من هذه الصفحة." : "Manage customer service team members from this page.");
        }
        if (currentView === "reports") {
          renderPlaceholder(main, "chart-no-axes-combined", t("reports"), language === "ar" ? "راجع أداء فريق الدعم والتذاكر من خلال التقارير." : "Review support performance and ticket activity through reports.");
        }
        if (currentView === "settings") {
          renderPlaceholder(main, "settings", t("settings"), language === "ar" ? "إعدادات اتفاقية مستوى الخدمة ومصادر التذاكر." : "SLA and ticket source settings.");
        }
        if (currentView === "guide") {
          renderPlaceholder(main, "book-open", t("guide"), language === "ar" ? "استخدم لوحة التحكم لمتابعة التذاكر، ثم افتح أي تذكرة لتحديثها." : "Use the dashboard to monitor tickets, then open any ticket to update it.");
        }

        applyLanguageChrome();
        lucide.createIcons();
      }

      document.querySelectorAll(".nav-link").forEach(button => {
        button.addEventListener("click", () => {
          currentView = button.dataset.view;
          document.getElementById("sidebar").classList.remove("open");
          render();
        });
      });

      document.getElementById("menuBtn").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
      });

      document.getElementById("createTicketBtn").addEventListener("click", openCreateModal);

      document.getElementById("languageToggle").addEventListener("click", () => {
        language = language === "ar" ? "en" : "ar";
        render();
      });

      render();
    })();
  </script>
 
</body></html>
